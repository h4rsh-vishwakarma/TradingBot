name: Python Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/tradingview_webhook_bot
          # pytest run karega (agar tests folders/files exist karte hain)
          pytest || echo "No tests found yet, but CI pipeline is ready!"
