name: CI - Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pytest pydantic python-binance python-dotenv tenacity gspread google-auth requests
      - name: Run tests
        run: |
          pytest tests/test_suite.py tests/test_orchestrator_flow.py -v --tb=short
