name: CI - Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pytest pydantic python-binance gspread google-auth requests python-dotenv pandas flask gunicorn tenacity
      - name: Run tests
        run: |
          cd tests && python -m pytest -v --tb=short
