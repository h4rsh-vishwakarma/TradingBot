name: CI - Tests & Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install linter
        run: pip install flake8
      - name: Lint core modules
        run: |
          flake8 tradingview_webhook_bot/core/orchestrator.py \
                 tradingview_webhook_bot/exchange/binance_client.py \
                 tradingview_webhook_bot/ledger/positions.py \
                 tradingview_webhook_bot/storage/signal_queue.py \
                 --max-line-length=200 --count --statistics \
                 --ignore=E501,W503,E402,F401,E722

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pytest pydantic python-binance python-dotenv tenacity gspread google-auth requests
      - name: Run tests
        run: |
          pytest tests/test_suite.py tests/test_orchestrator_flow.py -v --tb=short
