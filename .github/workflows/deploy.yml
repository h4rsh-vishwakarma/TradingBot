name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 13.236.143.201 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          # Sync files to server
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='logs/' \
            --exclude='storage/*.jsonl' \
            --exclude='storage/*.db' \
            --exclude='.env' \
            --exclude='aws-configs/' \
            --exclude='.claude/' \
            --exclude='*.backup' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ubuntu@13.236.143.201:/tmp/tradingview-deploy/

          # Deploy and restart bots with sudo
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@13.236.143.201 << 'ENDSSH'
            set -e

            # Backup current deployment
            BACKUP_DIR="$HOME/tradingview-bot.backup_$(date +%Y%m%d_%H%M%S)"
            echo "📦 Creating backup: $BACKUP_DIR"
            cp -r ~/Multi-Strategy-Crypto-Trading-Systems "$BACKUP_DIR"

            # Stop running bots (using sudo for root processes)
            echo "🛑 Stopping bots..."
            sudo pkill -TERM -f 'main_enhanced.py' || true
            sleep 5

            # Ensure all bots are stopped
            sudo pkill -KILL -f 'main_enhanced.py' || true
            sleep 2

            # Deploy new files - keep the organized structure
            echo "📤 Syncing files..."
            cd /tmp/tradingview-deploy
            rsync -av \
              --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='logs/' \
              --exclude='storage/' \
              --exclude='.env' \
              ./ ~/Multi-Strategy-Crypto-Trading-Systems/

            rm -rf /tmp/tradingview-deploy

            # Fix permissions for logs and storage
            echo "🔧 Fixing permissions..."
            sudo chown -R ubuntu:ubuntu ~/Multi-Strategy-Crypto-Trading-Systems/logs/ ~/Multi-Strategy-Crypto-Trading-Systems/storage/ 2>/dev/null || true
            sudo chown -R ubuntu:ubuntu ~/Multi-Strategy-Crypto-Trading-Systems/tradingview-webhook-bot/storage/ 2>/dev/null || true
            sudo chmod -R 755 ~/Multi-Strategy-Crypto-Trading-Systems/logs/ 2>/dev/null || true
            sudo chmod -R 755 ~/Multi-Strategy-Crypto-Trading-Systems/storage/ 2>/dev/null || true
            sudo chmod -R 755 ~/Multi-Strategy-Crypto-Trading-Systems/tradingview-webhook-bot/storage/ 2>/dev/null || true

            # Restart bots
            echo "🚀 Restarting bots..."
            cd ~/Multi-Strategy-Crypto-Trading-Systems
            source venv/bin/activate

            BOT_COUNT=0
            for config in config/config_*.json; do
              if [ -f "$config" ]; then
                strategy_name=$(basename "$config" .json | sed 's/config_//')
                echo "  → Starting $strategy_name"
                nohup python tradingview-webhook-bot/main_enhanced.py --config "$config" > "logs/bot_${strategy_name}.log" 2>&1 &
                BOT_COUNT=$((BOT_COUNT + 1))
              fi
            done

            echo ""
            echo "✅ Deployment complete!"
            echo "📊 Started $BOT_COUNT bots"
          ENDSSH

      - name: Verify deployment
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@13.236.143.201 << 'ENDSSH'
            echo "=== Deployment Verification ==="
            echo ""
            echo "Active Bot Processes:"
            ps aux | grep 'main_enhanced.py' | grep -v grep | wc -l | xargs echo "  Bots running:"
            echo ""
            echo "Directory Structure:"
            ls -la ~/Multi-Strategy-Crypto-Trading-Systems/ | grep -E "tradingview|config|strategies"
            echo ""
            echo "Recent Bot Activity:"
            tail -3 ~/Multi-Strategy-Crypto-Trading-Systems/logs/bot_institutional_flow_hybrid.log 2>/dev/null | jq -r '.message' 2>/dev/null || tail -3 ~/Multi-Strategy-Crypto-Trading-Systems/logs/bot_institutional_flow_hybrid.log
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
