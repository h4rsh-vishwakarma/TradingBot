name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 13.236.143.201 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          # Sync files to server
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='logs/' \
            --exclude='storage/*.jsonl' \
            --exclude='storage/*.db' \
            --exclude='.env' \
            --exclude='aws-configs/' \
            --exclude='.claude/' \
            --exclude='*.backup' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ubuntu@13.236.143.201:/tmp/tradingview-deploy/

          # Deploy files without restarting bots (bots run as root, need manual restart)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@13.236.143.201 << 'ENDSSH'
            set -e

            # Backup current deployment
            BACKUP_DIR="$HOME/tradingview-bot.backup_$(date +%Y%m%d_%H%M%S)"
            echo "Creating backup: $BACKUP_DIR"
            cp -r ~/tradingview-bot "$BACKUP_DIR"

            # Deploy new files
            echo "Syncing files..."
            cd /tmp/tradingview-deploy
            rsync -av --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='logs/' \
              --exclude='storage/' \
              --exclude='.env' \
              ./ ~/tradingview-bot/

            rm -rf /tmp/tradingview-deploy

            echo "Files deployed successfully!"
            echo "NOTE: Bots are running as root and were NOT restarted."
            echo "To restart bots, SSH into server and run:"
            echo "  sudo pkill -f main_enhanced.py"
            echo "  cd ~/tradingview-bot && source venv/bin/activate"
            echo "  for config in config/config_*.json; do python main_enhanced.py --config \"\$config\" & done"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@13.236.143.201 << 'ENDSSH'
            echo "=== Deployment Files Synced ==="
            ls -la ~/tradingview-bot/main_enhanced.py
            echo ""
            echo "=== Active Bot Processes ==="
            ps aux | grep 'main_enhanced.py' | grep -v grep | wc -l
            echo "bots running (will use new code on next restart)"
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
