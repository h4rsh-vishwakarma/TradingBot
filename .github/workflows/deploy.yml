name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 13.236.143.201 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          # Sync files to server
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='logs/' \
            --exclude='storage/*.jsonl' \
            --exclude='storage/*.db' \
            --exclude='.env' \
            --exclude='aws-configs/' \
            --exclude='.claude/' \
            --exclude='*.backup' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ubuntu@13.236.143.201:/tmp/tradingview-deploy/

          # Gracefully restart bots
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@13.236.143.201 << 'ENDSSH'
            set -e

            # Stop running bots
            echo "Stopping bots..."
            pkill -TERM -f 'main_enhanced.py' || true
            sleep 5

            # Backup current deployment
            BACKUP_DIR="~/tradingview-bot.backup_$(date +%Y%m%d_%H%M%S)"
            cp -r ~/tradingview-bot "$BACKUP_DIR"

            # Deploy new files
            cd /tmp/tradingview-deploy
            rsync -av --exclude='.git' \
              --exclude='__pycache__' \
              --exclude='logs/' \
              --exclude='storage/' \
              --exclude='.env' \
              ./ ~/tradingview-bot/

            rm -rf /tmp/tradingview-deploy

            # Restart bots
            cd ~/tradingview-bot
            source venv/bin/activate
            for config in config/config_*.json; do
              if [ -f "$config" ]; then
                strategy_name=$(basename "$config" .json | sed 's/config_//')
                echo "Starting bot: $strategy_name"
                nohup python main_enhanced.py --config "$config" > "logs/bot_${strategy_name}.log" 2>&1 &
              fi
            done

            echo "Deployment complete!"
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@13.236.143.201 << 'ENDSSH'
            echo "=== Active Bot Processes ==="
            ps aux | grep 'main_enhanced.py' | grep -v grep || echo "No bots running"

            echo ""
            echo "=== Recent Logs ==="
            tail -10 ~/tradingview-bot/logs/bot_institutional_flow_hybrid.log
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
