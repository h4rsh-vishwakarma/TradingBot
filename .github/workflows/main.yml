name: Trading Bot CI

on:
  push:
    branches: [ main, harsh ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install from requirements.txt to ensure consistency
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure testing tools are present
        pip install pytest pytest-mock pydantic flask gunicorn requests python-dotenv gspread google-auth

    - name: Create Mock Environment
      run: |
        # CI environment ke liye dummy files create karna taaki crash na ho
        mkdir -p tradingview_webhook_bot/storage
        touch tradingview_webhook_bot/storage/signals.jsonl
        touch tradingview_webhook_bot/storage/signals.offset
        echo "WEBHOOK_SECRET=test_secret" > .env
        echo "RUN_MODE=test" >> .env

    - name: Run Pytest
      env:
        # 🛡️ Ye line sabse important hai naye package structure ke liye
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Sirf naye structure ke valid tests run karein
        pytest tradingview_webhook_bot/tests/ -v01~
