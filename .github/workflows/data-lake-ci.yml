name: Data Lake CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/data-lake-ci.yml"
      - "docker-compose.glue.yml"
      - "glue/**"
      - "infra/**"
      - "pyproject.toml"
      - "src/data_lake/**"
      - "tests/data_lake/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/data-lake-ci.yml"
      - "docker-compose.glue.yml"
      - "glue/**"
      - "infra/**"
      - "pyproject.toml"
      - "src/data_lake/**"
      - "tests/data_lake/**"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data-lake package
        run: pip install -e ".[dev]"
      - name: Compile production Python
        run: python -m compileall -q src glue/jobs
      - name: Run data-lake unit tests
        run: pytest tests/data_lake

  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Initialize without backend
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Validate
        run: terraform -chdir=infra/terraform validate
