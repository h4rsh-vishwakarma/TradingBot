# TradingView Webhook - Nginx Reverse Proxy Configuration
# Production-grade setup with rate limiting and security

# Rate limiting zones (CRITICAL for preventing abuse)
limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=health_zone:10m rate=60r/m;

# Upstream to Gunicorn Unix socket (faster than TCP, more secure)
upstream tradingview_webhook {
    server unix:/run/tradingview_webhook.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Webhook endpoint (rate limited)
    location /webhook/tradingview {
        # Rate limiting: max 10 requests per minute per IP
        limit_req zone=webhook_zone burst=5 nodelay;
        limit_req_status 429;

        # Proxy settings
        proxy_pass http://tradingview_webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Body size limit (prevent large payloads)
        client_max_body_size 10k;
        client_body_buffer_size 10k;

        # Disable buffering for real-time processing
        proxy_buffering off;
    }

    # Health check endpoint (less restrictive rate limit)
    location /health {
        limit_req zone=health_zone burst=10 nodelay;

        proxy_pass http://tradingview_webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Quick timeouts for health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Signal status endpoint
    location ~ ^/webhook/status/[a-zA-Z0-9_-]+ {
        limit_req zone=health_zone burst=20 nodelay;

        proxy_pass http://tradingview_webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny all other locations
    location / {
        return 404;
    }

    # Custom error pages
    error_page 429 /rate_limit.html;
    location = /rate_limit.html {
        internal;
        return 429 '{"error": "Rate limit exceeded", "message": "Too many requests. Please wait and try again."}';
        add_header Content-Type application/json;
    }

    # Logging
    access_log /var/log/nginx/tradingview_webhook_access.log combined;
    error_log /var/log/nginx/tradingview_webhook_error.log warn;
}

