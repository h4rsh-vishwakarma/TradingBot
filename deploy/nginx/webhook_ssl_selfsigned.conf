    }

    location = /health/smc-luxalgo { proxy_pass http://webhook_backend/health; }
    location = /health/institutional-matrix { proxy_pass http://institutional_matrix_backend/health; }
    location = /health/institutional-flow-hybrid { proxy_pass http://institutional_flow_hybrid_backend/health; }
    location = /health/squeeze-flow-expansion { proxy_pass http://squeeze_flow_expansion_backend/health; }
