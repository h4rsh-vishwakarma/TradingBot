# HTTPS (self-signed for now; replace with Let's Encrypt cert when domain is ready)
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/ssl/localcerts/tradingview-selfsigned.crt;
    ssl_certificate_key /etc/ssl/localcerts/tradingview-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10k;

