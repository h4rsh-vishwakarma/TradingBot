upstream webhook_backend {
    server 127.0.0.1:8001;
}

upstream institutional_matrix_backend {
    server 127.0.0.1:8002;
}

upstream institutional_flow_hybrid_backend {
    server 127.0.0.1:8003;
}

upstream squeeze_flow_expansion_backend {
    server 127.0.0.1:8004;
}

upstream supertrend_btc_4h_backend {
    server 127.0.0.1:8005;
}

upstream obv_wavetrend_scalper_backend {
    server 127.0.0.1:8006;
}

upstream sma_crossover_9_21_backend {
    server 127.0.0.1:8007;
}

# HTTP (kept enabled until valid public cert/domain is configured)
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    location = /webhook/tradingview {
        if ($request_method != POST) { return 405; }
        limit_req zone=webhook_limit burst=20 nodelay;
        limit_conn webhook_conn 20;
        proxy_pass http://webhook_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /webhook/institutional-matrix {
        if ($request_method != POST) { return 405; }
        limit_req zone=webhook_limit burst=20 nodelay;
        limit_conn webhook_conn 20;
        proxy_pass http://institutional_matrix_backend/webhook/tradingview;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
